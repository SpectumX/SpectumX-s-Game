<!DOCTYPE html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>OC Pet</title>
<style>
:root{--bg:#f3f3f5;--fg:#1c1c22;--card:#fff;--line:#d8d8de;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17171c;--fg:#eee;--card:#24242b;--line:#3a3a44}}
:root[data-theme="dark"]{--bg:#17171c;--fg:#eee;--card:#24242b;--line:#3a3a44}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,"Noto Sans Thai",sans-serif;display:flex;justify-content:center;padding:12px}
#app{width:100%;max-width:640px}
.bar{display:flex;gap:10px;align-items:center;justify-content:space-between;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 12px;margin-bottom:8px;flex-wrap:wrap}
.hearts{font-size:24px;letter-spacing:2px}.h{color:#ddd}.h.f{color:#e0243c}.h.p{color:#e0243c;opacity:.5}
.m{font-size:13px}.m i{display:inline-block;width:70px;height:8px;background:var(--line);border-radius:4px;vertical-align:middle;overflow:hidden}.m b{display:block;height:100%}
#room{position:relative;width:100%;aspect-ratio:4/3;background:#fbfbfb;border:3px solid #222;border-radius:10px;overflow:hidden}
#floor{position:absolute;left:0;right:0;bottom:0;height:28%;background:#e6e6ea;border-top:3px solid #cfcfd6}
#desk{position:absolute;left:3%;bottom:20%;width:30%;height:34%}
#mon{position:absolute;left:18%;top:0;width:64%;height:55%;background:#111;border:3px solid #333;border-radius:4px}
#mon:after{content:"";position:absolute;inset:12%;background:#2b6cff;opacity:.85}
#stand{position:absolute;left:44%;top:55%;width:12%;height:8%;background:#333}
#top{position:absolute;left:0;right:0;top:62%;height:8%;background:#7a5a3c}
#leg1,#leg2{position:absolute;top:70%;bottom:-30%;width:6%;background:#5a3f28}#leg1{left:4%}#leg2{right:4%}
#bed{position:absolute;right:3%;bottom:19%;width:34%;height:20%}
#mat{position:absolute;inset:25% 0 0 0;background:#111;border-radius:6px}#pil{position:absolute;left:5%;top:5%;width:25%;height:40%;background:#3a3a44;border-radius:6px}
#pet{position:absolute;bottom:6%;height:34%;transform:translateX(-50%);background:no-repeat center bottom/contain;image-rendering:pixelated;cursor:pointer;user-select:none}
#pet.w{background-size:300% 100%;animation:wk .42s steps(3) infinite}@keyframes wk{from{background-position-x:0}to{background-position-x:150%}}
.pop{position:absolute;font-size:22px;pointer-events:none;animation:up 1s forwards}@keyframes up{to{transform:translateY(-50px);opacity:0}}
#msg{position:absolute;left:50%;top:6px;transform:translateX(-50%);background:#000a;color:#fff;font-size:13px;padding:3px 10px;border-radius:10px;opacity:0;transition:.3s;white-space:nowrap}
.btns{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
button{flex:1;min-width:90px;padding:12px;font-size:15px;border:1px solid var(--line);background:var(--card);color:var(--fg);border-radius:10px;cursor:pointer}button:active{transform:scale(.97)}
button.pr{background:#e0243c;color:#fff;border-color:#e0243c}
dialog{border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--fg);max-width:92vw;width:380px}
dialog input{width:100%;padding:8px;margin:6px 0;font-size:15px}#sl{max-width:100%;max-height:180px;margin-top:6px;display:none}.s{font-size:12px;opacity:.7}
</style></head><body><div id="app">
<div class="bar"><div class="hearts" id="hr"></div><div class="m">🍖 <i><b id="bf" style="background:#e08a1e"></b></i> 💧 <i><b id="bw" style="background:#2b9cff"></b></i></div><div class="m">🍪 <b id="tr"></b><span id="nx" class="s"></span></div></div>
<div id="room"><div id="floor"></div>
<div id="desk"><div id="mon"></div><div id="stand"></div><div id="top"></div><div id="leg1"></div><div id="leg2"></div></div>
<div id="bed"><div id="mat"></div><div id="pil"></div></div>
<div id="pet"></div><div id="msg"></div></div>
<div class="btns"><button id="bfd">🍪 ให้ขนม</button><button id="bwt">💧 ให้น้ำ</button><button id="bdn">💖 โดเนท</button><button id="bsv" class="pr">💾 เซฟ</button></div>
<p class="s">แตะที่ตัวละครเพื่อลูบหัว · ขนมเกิดใหม่ 1 ชิ้นทุก 30 นาที (เก็บได้สูงสุด 10) · เซฟอัตโนมัติทุก 30 วินาที</p></div>
<dialog id="dg"><h3 style="margin-top:0">โดเนทแลกขนม</h3>
<div class="s">10 บาท = ขนม 100 ชิ้น<br>โอนเงินไปที่: <b>[ใส่เลขพร้อมเพย์/บัญชีของคุณตรงนี้]</b></div>
<label>อัปโหลดสลิป<input id="fl" type="file" accept="image/*"></label><img id="sl">
<p class="s">ระบบตรวจสลิปอัตโนมัติ ขนมคิดจากยอดที่ธนาคารยืนยัน (ใช้สลิปซ้ำไม่ได้)<br>รหัสผู้เล่น (เก็บไว้): <span id="pidv"></span></p>
<div class="btns"><button id="dc">ยกเลิก</button><button id="dk" class="pr">ยืนยัน</button></div></dialog>
<script>
const K="ocpet_v1",HALF=18e5,$=id=>document.getElementById(id);
let S={love:30,food:70,water:70,treats:10,regen:Date.now(),last:Date.now(),slips:[]};
try{const r=localStorage.getItem(K);if(r)S=Object.assign(S,JSON.parse(r))}catch(e){}
function save(show){try{S.last=Date.now();localStorage.setItem(K,JSON.stringify(S));if(show)say("เซฟแล้ว ✅")}catch(e){if(show)say("เซฟไม่ได้ ❌")}}
function say(t){const m=$("msg");m.textContent=t;m.style.opacity=1;clearTimeout(say.t);say.t=setTimeout(()=>m.style.opacity=0,1800)}
const cl=v=>Math.max(0,Math.min(100,v));
function decay(min){S.food=cl(S.food-min/3);S.water=cl(S.water-min/2);if(S.food<20||S.water<20)S.love=cl(S.love-min/6)}
let NX=0;function regen(){}
decay(Math.min((Date.now()-S.last)/6e4,1440));
function ui(){let h="";for(let i=0;i<5;i++){const v=S.love-i*20;h+='<span class="h '+(v>=20?'f':v>=10?'p':'')+'">♥</span>'}
 $("hr").innerHTML=h;$("bf").style.width=S.food+"%";$("bw").style.width=S.water+"%";$("tr").textContent=S.treats+(S.treats>=10?" (เต็ม)":"");
 $("nx").textContent=S.treats<10&&NX?" ใหม่ใน "+Math.ceil(NX/6e4)+" นาที":""}
function pop(e){const d=document.createElement("div");d.className="pop";d.textContent=e;d.style.left=pet.offsetLeft-8+"px";d.style.top=(pet.offsetTop-6)+"px";$("room").appendChild(d);setTimeout(()=>d.remove(),1000)}
const pet=$("pet");
let PID="";try{PID=localStorage.getItem("ocpid")||""}catch(e){}
if(!PID){PID=Array.from(crypto.getRandomValues(new Uint8Array(12)),b=>b.toString(36).padStart(2,"0")).join("");try{localStorage.setItem("ocpid",PID)}catch(e){}}
async function api(p,b){try{const f=b instanceof FormData;if(f)b.append("pid",PID);const r=await fetch("/api/"+p,{method:"POST",headers:f?{}:{"content-type":"application/json"},body:f?b:JSON.stringify({...b,pid:PID})});const d=await r.json();if(d.treats!=null){S.treats=d.treats;NX=d.next||0;ui()}return d}catch(e){return{error:"เชื่อมต่อเซิร์ฟเวอร์ไม่ได้"}}}
const sync=()=>api("state",{});
$("bfd").onclick=async()=>{if(S.food>=100)return say("อิ่มแล้ว~");const d=await api("feed",{});if(d.error)return say(d.treats===0?"ขนมหมดแล้ว รอ 30 นาที หรือโดเนทนะ":d.error);S.food=cl(S.food+15);S.love=cl(S.love+4);pop("🍪");ui();save()};
$("bwt").onclick=()=>{if(S.water>=100)return say("ไม่กระหายแล้ว~");S.water=cl(S.water+25);S.love=cl(S.love+2);pop("💧");ui();save()};
pet.onclick=()=>{S.love=cl(S.love+1);pop("💖");ui()};
$("bsv").onclick=()=>save(true);
$("bdn").onclick=()=>$("dg").showModal();$("dc").onclick=()=>$("dg").close();
$("fl").onchange=e=>{const f=e.target.files[0],i=$("sl");if(!f){i.style.display="none";return}i.src=URL.createObjectURL(f);i.style.display="block"};
$("dk").onclick=async()=>{const f=$("fl").files[0];if(!f)return say("กรุณาอัปโหลดสลิป");$("dk").disabled=true;say("กำลังตรวจสลิป...");const fd=new FormData();fd.append("slip",f);const d=await api("redeem",fd);$("dk").disabled=false;if(d.error)return say(d.error);$("dg").close();$("fl").value="";$("sl").style.display="none";say("ได้ขนม +"+d.added+" ชิ้น! ขอบคุณนะ 💖")};
